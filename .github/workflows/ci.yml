name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck sox
      - name: Syntax
        run: bash -n bin/record packaging/*.sh
      - name: ShellCheck
        run: shellcheck -S warning bin/record packaging/*.sh
      - name: Help and version
        run: |
          bin/record -h | head -3
          bin/record -V
          v=$(sed -n 's/^VERSION="\(.*\)"/\1/p' bin/record)
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $v"; exit 1; }
